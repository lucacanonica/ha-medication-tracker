# Subview with the 48 h timeline (markdown card). Add under `views:` of your dashboard.

type: sections
max_columns: 1
title: Medication Log
path: medication-log
icon: mdi:math-log
subview: true
sections:
  - type: grid
    cards:
      - type: markdown
        content: '{{ state_attr(''sensor.medication_timeline'', ''timeline'') }}'
        grid_options:
          columns: 12
          rows: auto
        visibility:
          - condition: numeric_state
            entity: sensor.medication_timeline
            above: 0
        card_mod:
          style: |
            ha-card {
              --ha-card-header-font-size: 1.2em;
              --ha-card-header-font-weight: 500;
              --ha-card-header-color: var(--secondary-text-color);
            }
            ha-card .card-header, ha-card h1 { padding: 12px 16px 0 16px; font-size: 1.2em; font-weight: 500; color: var(--secondary-text-color); line-height: 1.3; }
header:
  layout: start
  badges_position: top
  badges_wrap: wrap
badges:
  - type: shortcut
    tap_action:
      action: navigate
      navigation_path: /YOUR-DASHBOARD
    icon: mdi:arrow-left
    color: black
    text: ' '
