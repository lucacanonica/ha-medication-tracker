# Medication section for a wall panel (e.g. NSPanel Pro): tiles at zoom 1.3, three-line status.
# Paste as a section (sections view). Replace /YOUR-DASHBOARD/ with your dashboard URL path.

type: grid
cards:
  - type: heading
    heading: Medication
    heading_style: subtitle
    icon: mdi:medication
  - type: tile
    entity: sensor.medication_tylenol
    icon: mdi:pill
    state_content: summary
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: script.medication_record
        data:
          source: tap
          medication: tylenol
          browser_id: THIS
          user_id: THIS
    icon_tap_action:
      action: fire-dom-event
      browser_mod:
        service: script.medication_record
        data:
          source: open_form
          medication: tylenol
          browser_id: THIS
          user_id: THIS
    double_tap_action:
      action: fire-dom-event
      browser_mod:
        service: script.medication_record
        data:
          source: open_form
          medication: tylenol
          browser_id: THIS
          user_id: THIS
    hold_action:
      action: fire-dom-event
      browser_mod:
        service: script.medication_record
        data:
          source: open_form
          medication: tylenol
          browser_id: THIS
          user_id: THIS
    card_mod:
      style:
        ha-tile-info$: |
          .info { height: auto !important; }
          .primary, .secondary { white-space: pre-line !important; overflow: visible !important; text-overflow: clip !important; }
        .: |
          ha-card {
            zoom: 1.3;
            {% set s = states('sensor.medication_tylenol') %}
            {% if s == 'eligible' %}
              background: #D8F3DC !important; --tile-color: #2E7D32;
            {% elif s == 'approaching' %}
              background: #FFF0B3 !important; --tile-color: #B26A00;
            {% elif s == 'too_soon' %}
              background: #FADADD !important; --tile-color: #C62828;
            {% else %}
              background: #E5E7EB !important; --tile-color: #6B7280;
            {% endif %}
            --primary-text-color: #172B20;
            --secondary-text-color: #374151;
            transition: background 0.3s ease;
          }
          state-display { white-space: pre-line !important; }
    grid_options:
      columns: 6
      rows: 2
    name: Tylenol
